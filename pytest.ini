[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
pythonpath = .
# `-m "not live"` is not optional: it deselects tests that make real, paid LLM
# calls. The course budget is $13 total, and a full suite run that quietly
# billed against it would be unrecoverable.
addopts = -q -m "not live and not supabase" --ignore=tests/pending_supabase
markers =
    live: makes real LLM API calls (costs money, non-deterministic, needs
        credentials) -- deselected by default, run explicitly with `pytest -m live`
    supabase: queries the real Supabase database. Free, but ~45s and useless
        without credentials -- where it would SKIP, and a skipped reachability
        check is a claim that nothing was verified. Deselected to keep the unit
        loop at a second; run with `pytest -m supabase` BEFORE SUBMITTING, since
        it is the only thing that checks every advertised tool can actually be
        fed by a route the model can walk.
